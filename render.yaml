services:
  - type: web
    name: quillit-api
    runtime: node
    plan: free
    buildCommand: npm install --no-audit --no-fund --legacy-peer-deps && npm run build
    startCommand: npx tsx server.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
