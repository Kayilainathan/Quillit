<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#FAF8F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E0E0D" media="(prefers-color-scheme: dark)" />
    <title>Quillit · Private Writing Studio & English Fluency Tracker</title>
    <meta name="description" content="Private encrypted writing studio, English fluency coach, and multidimensional progress tracker for engineering and personal journaling." />
    <meta property="og:title" content="Quillit · Private Writing Studio & English Fluency Tracker" />
    <meta property="og:description" content="Private encrypted writing studio, English fluency coach, and multidimensional progress tracker for engineering and personal journaling." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="./quillit-mark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('quillit_theme') || localStorage.getItem('cadence_theme') || 'system';
          if (localStorage.getItem('cadence_theme') && !localStorage.getItem('quillit_theme')) {
            localStorage.setItem('quillit_theme', pref);
          }
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = pref === 'light' || pref === 'dark' ? pref : (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.setAttribute('data-theme-pref', pref);
          if (resolved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-canvas text-ink-primary antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
